name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tout:
        description: "Signaler toutes les pages aux moteurs IndexNow"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vérifier les données
        run: node scripts/validate.mjs
      - name: Adresse du site GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Pages déjà en ligne (dates de mise à jour du sitemap)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build-cache
          curl -fsSL "${{ steps.pages.outputs.base_url }}/pages.json" -o build-cache/pages.json || echo "{}" > build-cache/pages.json
      - name: Générer le site
        run: node scripts/build.mjs --base-url "${{ steps.pages.outputs.base_url || 'https://example.com' }}"
      - name: Préparer la publication
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Garder la liste des pages modifiées
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-modifiees
          path: build-cache/changed-urls.json
          retention-days: 3

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pages-modifiees
          path: build-cache
      - name: Prévenir les moteurs de recherche (IndexNow)
        env:
          INDEXNOW_ALL: ${{ inputs.tout && '1' || '' }}
        run: node scripts/indexnow.mjs build-cache/changed-urls.json
